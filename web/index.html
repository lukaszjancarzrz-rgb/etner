<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#051427" media="(prefers-color-scheme: dark)" data-dark />
    <meta name="theme-color" content="#0a2240" />
    <meta name="description" content="Harmonogram, zlecenia i zakupy ETNER" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/sofia-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>ETNER</title>
    <script>
      // motyw przed pierwszym malowaniem (bez mignięcia)
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; document.querySelector('meta[data-dark]').media = t === 'dark' ? 'all' : 'not all'; } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
